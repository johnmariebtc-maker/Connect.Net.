<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Result — ConnectNet</title><link rel="stylesheet" href="/styles.css"></head><body><main style="width:min(650px,92%);margin:80px auto"><div class="card" style="background:#fff;border:1px solid #d9e5f2;border-radius:16px;padding:30px;text-align:center"><h1 id="title">Confirming payment…</h1><p id="msg">Please wait.</p><div id="voucher" style="display:none;margin-top:20px;background:#06244b;color:#fff;padding:20px;border-radius:12px"><h3>Your Wi-Fi Voucher</h3><p>Username: <b id="u"></b></p><p>Password: <b id="p"></b></p></div><a class="btn btn-primary" href="/connectnet-homepage.html">Home</a></div></main><script src="/js/common.js"></script><script>(async()=>{if(!CN.token()){location.href='/login.htm';return}const ref=new URLSearchParams(location.search).get('reference')||new URLSearchParams(location.search).get('trxref');if(!ref){document.getElementById('title').textContent='No payment reference';return}try{const d=await CN.api('/api/payments/verify',{method:'POST',body:JSON.stringify({reference:ref})});if(d.voucher){document.getElementById('title').textContent='Payment Confirmed';document.getElementById('msg').textContent='Your voucher has been generated and emailed to you.';document.getElementById('voucher').style.display='block';document.getElementById('u').textContent=d.voucher.username;document.getElementById('p').textContent=d.voucher.password}else{document.getElementById('title').textContent='Payment is still processing';document.getElementById('msg').textContent='Refresh this page shortly. The webhook will activate your voucher after confirmation.'}}catch(e){document.getElementById('title').textContent='Payment verification failed';document.getElementById('msg').textContent=e.message}})();</script></body></html>
