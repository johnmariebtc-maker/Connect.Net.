<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buy Wi-Fi — ConnectNet</title><link rel="stylesheet" href="/styles.css"><style>.checkout{width:min(1100px,92%);margin:35px auto 70px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:16px;padding:24px;box-shadow:0 8px 25px rgba(22,60,100,.08)}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.plan{border:2px solid #d9e5f2;border-radius:12px;padding:16px;cursor:pointer}.plan.selected{border-color:#087cf5;background:#f3f9ff}.plan input{display:none}.field{margin:15px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d9e5f2;border-radius:9px}.pay{width:100%;padding:14px;border:0;border-radius:10px;background:#087cf5;color:#fff;font-weight:800;cursor:pointer}.notice{margin:12px 0;padding:12px;border-radius:9px;background:#f3f9ff;color:#29466b}.voucher{background:#06244b;color:#fff;border-radius:12px;padding:20px;margin-top:16px;display:none}.voucher b{font-size:22px;letter-spacing:1px}@media(max-width:800px){.checkout{grid-template-columns:1fr}.plans{grid-template-columns:1fr 1fr}}@media(max-width:480px){.plans{grid-template-columns:1fr}}</style></head><body><header class="navbar"><div class="nav-container"><a href="/connectnet-homepage.html" class="logo"><span class="logo-icon">⌁</span><span>ConnectNet<small>Stay Connected, Achieve More</small></span></a><div class="nav-buttons"><a href="/connectnet-homepage.html" class="btn btn-outline">Home</a><button id="logout" class="btn btn-primary">Logout</button></div></div></header><main class="checkout"><section class="card"><h1>Purchase Wi-Fi</h1><p style="color:#64748b">Choose your bundle and hotspot.</p><div class="field"><label>Wi-Fi Package</label><div id="plans" class="plans"></div></div><div class="field"><label>Hotspot Location</label><select id="hotspot"></select></div><div class="field"><label>Payment Method</label><select id="method"><option>Mobile Money</option><option>Card</option><option>Bank Transfer</option></select></div><div class="field"><label>Mobile Money Number (for Mobile Money)</label><input id="momo" placeholder="0241234567"></div><button id="pay" class="pay">Proceed to Secure Payment</button><div id="msg" class="notice"></div></section><aside class="card"><h2>Order Summary</h2><p>Package: <b id="sPackage">—</b></p><p>Data: <b id="sData">—</b></p><p>Price: <b id="sPrice">—</b></p><p>Location: <b id="sHotspot">—</b></p><div id="voucher" class="voucher"><h3>Voucher Ready</h3><p>Username</p><b id="vUser"></b><p>Password</p><b id="vPass"></b><p id="vInfo"></p></div></aside></main><script src="/js/common.js"></script><script src="/js/payment.js"></script></body></html>
