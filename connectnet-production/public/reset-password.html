<!doctype html><html><body><main style="max-width:430px;margin:80px auto;font-family:Arial"><h1>Reset password</h1><input id="password" type="password" placeholder="New password" style="width:100%;padding:12px"><button id="go" style="margin-top:12px;padding:12px;width:100%">Reset password</button><p id="msg"></p></main><script src="/js/common.js"></script><script>document.getElementById('go').onclick=async()=>{try{await CN.api('/api/auth/reset-password',{method:'POST',body:JSON.stringify({token:new URLSearchParams(location.search).get('token'),password:document.getElementById('password').value})});document.getElementById('msg').textContent='Password reset. You can now login.'}catch(e){document.getElementById('msg').textContent=e.message}}</script></body></html>
