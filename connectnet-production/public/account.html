<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My ConnectNet Account</title><style>body{font-family:Arial;background:#f4f8fc;color:#173557;margin:0}.wrap{width:min(1000px,92%);margin:40px auto}.card{background:#fff;padding:22px;border:1px solid #dce6f0;border-radius:15px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.voucher{background:#06244b;color:#fff;padding:18px;border-radius:12px}</style></head><body><div class="wrap"><div class="card"><h1>My ConnectNet Account</h1><p id="user"></p><button id="logout">Logout</button></div><div id="vouchers" class="grid"></div><a href="/payment.htm">Purchase another bundle</a></div><script src="/js/common.js"></script><script>(async()=>{if(!CN.token())return location.href='/login.htm';try{const d=await CN.api('/api/me/dashboard');document.getElementById('user').textContent=`${d.user.name} · ${d.user.email}`;document.getElementById('vouchers').innerHTML=d.vouchers.map(v=>`<div class="voucher"><h3>${v.package_name}</h3><p>Username: <b>${v.username}</b></p><p>Password: <b>${v.password}</b></p><p>Status: ${v.status}</p><p>Used: ${CN.bytes(v.data_used_bytes)} / ${CN.bytes(v.data_limit_bytes)}</p><p>Expires: ${v.expires_at||'Data limit'}</p></div>`).join('')||'<div class="card">No vouchers yet.</div>'}catch(e){alert(e.message)}})();document.getElementById('logout').onclick=CN.logout;</script></body></html>
